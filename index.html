<div class="video-player-wrapper">

  <video id="watchVideo" controls playsinline></video>

  <div class="audio-language-bar">
    <label for="audioLanguageSelect">
      🎧 Áudio
    </label>

    <select id="audioLanguageSelect" aria-label="Escolher idioma do áudio">
      <option value="original">🇧🇷 Original</option>
    </select>

    <span id="audioStatus" class="audio-status">
      Áudio original
    </span>
  </div>

  <audio id="dubAudio" preload="auto"></audio>

</div>

<h2 id="watchTitle"></h2>
